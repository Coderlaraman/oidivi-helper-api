services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: oidivi-helper-api-dev
    ports:
      - "8000:80"    # Nginx HTTP
      - "8080:8080"  # Reverb WS (dev)
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Database (local MySQL container)
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: oidivi_helper
      DB_USERNAME: oidivi_user
      DB_PASSWORD: secret
      # Prefer DB/file-backed drivers for parity without Redis
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      # Volumen persistente para storage (archivos subidos)
      - storage_data:/var/www/html/storage/app/public
      # Volumen para logs (opcional, para debugging)
      - logs_data:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      default:
        aliases:
          - oidivi-helper-api
    # Ejecutar script de inicialización después del arranque
    command: >
      sh -c "
        # Instalar dependencias de Composer
        composer install &&
        # Configurar permisos
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
        chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
        # Ejecutar migraciones y seeders
        php artisan migrate --force &&
        php artisan db:seed --force &&
        # Ejecutar script de inicialización
        /var/www/html/docker/scripts/init-storage.sh &&
        # Iniciar supervisor
        /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: oidivi-helper-mysql-dev
    environment:
      MYSQL_DATABASE: oidivi_helper
      MYSQL_USER: oidivi_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"  # Expose MySQL to host for HeidiSQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default
    restart: unless-stopped

volumes:
  mysql_data:
  # Volúmenes para archivos persistentes
  storage_data:
  logs_data:

networks:
  default:
    external: true
    name: oidivi_helper_net