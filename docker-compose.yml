services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "6001:6001"
    environment:
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      # Volumen persistente para storage (archivos subidos)
      - storage_data:/var/www/html/storage/app/public
      # Volumen para logs (opcional, para debugging)
      - logs_data:/var/www/html/storage/logs
    networks:
      default:
        aliases:
          - oidivi-helper-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Ejecutar script de inicialización después del arranque
    command: >
      sh -c "
        # Ejecutar script de inicialización
        /var/www/html/docker/scripts/init-storage.sh &&
        # Iniciar supervisor
        /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # En producción puedes omitir exponer el puerto. Si necesitas administración remota, descomenta:
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default
    restart: unless-stopped

volumes:
  mysql_data:
  # Volúmenes para archivos persistentes
  storage_data:
  logs_data:

networks:
  default:
    external: true
    name: oidivi_helper_net