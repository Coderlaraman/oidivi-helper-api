services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    container_name: oidivi-helper-api
    ports:
      - "8000:80"
      - "${REVERB_SERVER_PORT:-8080}:${REVERB_SERVER_PORT:-8080}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-oidivi_helper}
      DB_USERNAME: ${DB_USERNAME:-coderman}
      DB_PASSWORD: ${DB_PASSWORD:-coderman}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-reverb}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8080}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oidivi_helper_net
    command: >
      sh -c "
        if [ \"$APP_ENV\" = \"local\" ]; then
          echo 'Running composer install, migrations and seeders for local...';
          composer install &&
          php artisan migrate --force &&
          php artisan db:seed --force;
        fi &&
        echo 'Initializing storage directories...' &&
        /var/www/html/docker/scripts/init-storage.sh &&
        echo 'Starting Supervisor...' &&
        /usr/bin/supervisord -c /etc/supervisor/conf.d/active.conf
      "
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: oidivi-helper-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-oidivi_helper}
      MYSQL_USER: ${DB_USERNAME:-coderman}
      MYSQL_PASSWORD: ${DB_PASSWORD:-coderman}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - oidivi_helper_net
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data:

networks:
  oidivi_helper_net:
    external: true
