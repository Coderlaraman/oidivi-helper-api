services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "6001:6001"
    environment:
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    networks:
      default:
        aliases:
          - oidivi-helper-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # En producción puedes omitir exponer el puerto. Si necesitas administración remota, descomenta:
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  default:
    external: true
    name: oidivi_helper_net