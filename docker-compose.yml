services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
      - "6001:6001"
    environment:
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    networks:
      default:
        aliases:
          - oidivi-helper-api
    restart: unless-stopped

networks:
  default:
    external: true
    name: oidivi_helper_net