name: Deploy OiDiVi Helper Backend to Amazon Lightsail with Docker

on:
  push:
    branches:
      - docker_work_branch
      - main
      - work_branch
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Debug - Show changed files
        run: |
          echo "=== INFORMACIÓN DE DEBUG ==="
          echo "Rama actual: ${{ github.ref }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Repositorio: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo ""
          echo "=== ARCHIVOS EN EL REPOSITORIO ==="
          find . -type f -name "*.yml" -o -name "*.yaml" | head -10
          echo ""
          echo "=== ESTRUCTURA DEL DIRECTORIO ==="
          ls -la
          echo ""
          echo "=== ARCHIVOS MODIFICADOS EN ESTE PUSH ==="
          git diff --name-only HEAD~1 HEAD || echo "No se pueden obtener archivos modificados"
          
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: debug-info
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo de prueba
        run: |
          echo "✅ API workflow disparado correctamente desde ${{ github.ref }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Repositorio: ${{ github.repository }}"