name: Deploy OiDiVi Helper Backend to Amazon Lightsail with Docker

on:
  push:
    branches:
      - docker_main
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload API project to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH_API }}

      - name: Write API .env file from secret
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.DEPLOY_PATH_API }}"
            cd "${{ secrets.DEPLOY_PATH_API }}"
            cat > .env << 'EOF'
            ${{ secrets.API_ENV_FILE }}
            EOF

      - name: Deploy API via Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Ensure shared Docker network exists
            docker network inspect oidivi_helper_net >/dev/null 2>&1 || docker network create oidivi_helper_net
            
            # Navigate to API deployment path
            cd "${{ secrets.DEPLOY_PATH_API }}"
            
            # Bring down existing services
            docker compose down --remove-orphans
            
            # Build and start services
            docker compose up -d --build
            
            # Prune old images to save space
            docker image prune -f